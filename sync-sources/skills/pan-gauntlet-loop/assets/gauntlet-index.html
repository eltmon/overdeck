<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauntlet — Live Progress</title>
<style>
  :root {
    --bg: #131417; --panel: #1c1e23; --ink: #e6e4dc; --dim: #8d8f98;
    --line: #33363e; --gold: #c9a227; --glow: #6fc7bd; --red: #c25b4a;
    --green: #6fae5c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 Georgia, 'Times New Roman', serif;
    padding: 28px clamp(16px, 4vw, 48px);
  }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 26px; letter-spacing: 0.06em; font-variant: small-caps; }
  h1 .accent { color: var(--gold); }
  #meta { color: var(--dim); font-size: 13px; }
  #tagline { color: var(--dim); font-style: italic; margin-bottom: 22px; font-size: 13px; }
  .grid {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .shot {
    aspect-ratio: 16/9; background: #0c0d10; display: flex;
    align-items: center; justify-content: center; overflow: hidden; position: relative;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot .none { color: #45484f; font-size: 13px; letter-spacing: 0.08em; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .titlerow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .title { font-size: 16px; font-variant: small-caps; letter-spacing: 0.04em; }
  .badge {
    font: 700 11px/1 system-ui, sans-serif; letter-spacing: 0.08em;
    padding: 4px 9px; border-radius: 3px; white-space: nowrap;
  }
  .b-notstarted { color: var(--dim); border: 1px solid var(--line); }
  .b-inprogress { color: #0c0d10; background: var(--gold); }
  .b-critique   { color: #0c0d10; background: var(--glow); }
  .b-wowed      { color: #0c0d10; background: var(--green); }
  .b-notyet     { color: #fff; background: var(--red); }
  .b-delivered  { color: #0c0d10; background: var(--glow); }
  .note { color: var(--dim); font-size: 13px; }
  .defects { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .defects li {
    font-size: 12.5px; color: var(--ink); padding-left: 14px; position: relative;
  }
  .defects li::before { content: '✕'; color: var(--red); position: absolute; left: 0; font-size: 10px; top: 2px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; }
  #err { color: var(--red); margin-top: 20px; display: none; }
  #media-section { margin-top: 30px; }
  #media-section h2 {
    font-size: 18px; font-variant: small-caps; letter-spacing: 0.06em;
    margin-bottom: 10px; color: var(--gold);
  }
  .tracks { display: flex; flex-direction: column; gap: 6px; max-width: 720px; }
  .track {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px;
  }
  .play {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--gold);
    background: none; color: var(--gold); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .play:hover, .play.playing { background: var(--gold); color: #0c0d10; }
  .t-title { font-size: 14.5px; }
  .t-meta { color: var(--dim); font-size: 12px; }
  .t-kind {
    font: 700 10px/1 system-ui, sans-serif; letter-spacing: 0.08em;
    padding: 3px 7px; border-radius: 3px; border: 1px solid var(--line);
    color: var(--dim); flex: none;
  }
  .t-right { margin-left: auto; color: var(--dim); font-size: 12px; flex: none; }
</style>
</head>
<body>
<header>
  <h1>The <span class="accent">Gauntlet</span> — <span id="project">loading…</span></h1>
  <span id="meta"></span>
</header>
<p id="tagline"></p>
<div class="grid" id="grid"></div>
<section id="media-section" style="display:none">
  <h2>Generated Media</h2>
  <div class="tracks" id="tracks"></div>
</section>
<p id="err"></p>
<audio id="player"></audio>
<script>
// Live gauntlet progress page. Renders entirely from status.json (+ optional
// media-manifest.json); copied verbatim into each project's gauntlet/ dir.
const badge = (a) => {
  if (a.verdict === 'WOWED')  return ['b-wowed', 'WOWED'];
  if (a.verdict === 'NOT_YET') return ['b-notyet', 'NOT YET · iter ' + a.iteration];
  if (a.status === 'IN PROGRESS' || /ITER \d+ IN PROGRESS/.test(a.status || '')) return ['b-inprogress', a.status];
  if (a.status === 'AWAITING CRITIQUE') return ['b-critique', 'AWAITING CRITIQUE'];
  if ((a.status || '').match(/DELIVERED|SHIPPED|WIRED/)) return ['b-delivered', a.status];
  return ['b-notstarted', a.status || 'NOT STARTED'];
};

// Per-area card registry: create once, then mutate in place — no flashing.
const cards = {}; // key -> {el, img, lastUpdated}

function ensureCard(key) {
  if (cards[key]) return cards[key];
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML =
    '<div class="shot"><span class="none">NO CAPTURE YET</span></div>' +
    '<div class="body">' +
      '<div class="titlerow"><span class="title"></span><span class="badge"></span></div>' +
      '<div class="note"></div>' +
      '<ul class="defects"></ul>' +
      '<div class="foot"><span class="f-iter"></span><span class="f-time"></span></div>' +
    '</div>';
  document.getElementById('grid').appendChild(el);
  cards[key] = { el, img: null, lastUpdated: null };
  return cards[key];
}

function setText(el, sel, text) {
  const n = el.querySelector(sel);
  if (n.textContent !== text) n.textContent = text;
}

function updateCard(key, a) {
  const c = ensureCard(key);
  const [cls, label] = badge(a);
  setText(c.el, '.title', a.title || key);
  const b = c.el.querySelector('.badge');
  if (b.className !== 'badge ' + cls) b.className = 'badge ' + cls;
  if (b.textContent !== label) b.textContent = label;
  setText(c.el, '.note', a.note || '');
  const defects = (a.defects || []).slice(0, 5).map(d =>
    typeof d === 'string' ? d : (d.element + ' — ' + d.fix));
  const ul = c.el.querySelector('.defects');
  const want = defects.map(d => '<li>' + d + '</li>').join('');
  if (ul.innerHTML !== want) ul.innerHTML = want;
  setText(c.el, '.f-iter', 'iteration ' + (a.iteration || 0));
  setText(c.el, '.f-time', a.updated ? new Date(a.updated).toLocaleTimeString() : '');

  // Screenshot: reload only when the area's timestamp changes (or first pass).
  if (c.lastUpdated !== a.updated || !c.img) {
    const probe = new Image();
    probe.onload = () => {
      const holder = c.el.querySelector('.shot');
      if (!c.img) { holder.innerHTML = ''; c.img = probe; holder.appendChild(probe); }
      else c.img.src = probe.src; // swap after load — old frame stays until ready
    };
    probe.onerror = () => { c.lastUpdated = a.updated; }; // no shot yet; stop retrying this stamp
    probe.src = 'shots/' + key + '.png?t=' + Date.now();
    c.lastUpdated = a.updated;
  }
}

async function refresh() {
  try {
    const r = await fetch('status.json?t=' + Date.now());
    const s = await r.json();
    if (s.project) document.getElementById('project').textContent = s.project;
    if (s.tagline) document.getElementById('tagline').textContent = s.tagline;
    document.getElementById('meta').textContent =
      (s.pass || '') + ' · updated ' + new Date(s.updated).toLocaleTimeString();
    for (const [key, a] of Object.entries(s.areas || {})) updateCard(key, a);
    document.getElementById('err').style.display = 'none';
  } catch (e) {
    const el = document.getElementById('err');
    el.textContent = 'status.json unreadable: ' + e.message;
    el.style.display = 'block';
  }
}

// Optional media list (audio/video generated during the pass) — built once
// per manifest version, keyed by updated stamp.
const player = document.getElementById('player');
let currentFile = null;
let mediaVersion = null;
player.addEventListener('ended', () => { currentFile = null; markPlaying(); });
player.addEventListener('pause', markPlaying);
player.addEventListener('play', markPlaying);
function markPlaying() {
  document.querySelectorAll('.play').forEach(b => {
    const active = b.dataset.file === currentFile && !player.paused;
    b.classList.toggle('playing', active);
    b.textContent = active ? '❚❚' : '▶';
  });
}
function togglePlay(file) {
  if (currentFile === file && !player.paused) { player.pause(); }
  else {
    if (currentFile !== file) { player.src = file; currentFile = file; }
    player.play();
  }
  markPlaying();
}
async function refreshMedia() {
  try {
    const r = await fetch('media-manifest.json?t=' + Date.now());
    if (!r.ok) return;
    const m = await r.json();
    if (!m.tracks || !m.tracks.length || m.updated === mediaVersion) return;
    mediaVersion = m.updated;
    document.getElementById('media-section').style.display = 'block';
    const list = document.getElementById('tracks');
    list.innerHTML = '';
    for (const t of m.tracks) {
      const row = document.createElement('div');
      row.className = 'track';
      row.innerHTML =
        '<button class="play" data-file="' + t.file + '">▶</button>' +
        '<div><div class="t-title">' + t.title + '</div>' +
        '<div class="t-meta">' + (t.placement || '') + '</div></div>' +
        '<span class="t-kind">' + (t.kind || '').toUpperCase() + '</span>' +
        '<span class="t-right">' + (t.duration || '') + '</span>';
      row.querySelector('.play').addEventListener('click', () => togglePlay(t.file));
      list.appendChild(row);
    }
    markPlaying();
  } catch (e) { /* manifest optional */ }
}
refresh();
refreshMedia();
setInterval(refresh, 5000);
setInterval(refreshMedia, 15000);
</script>
</body>
</html>
