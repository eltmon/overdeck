<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overdeck</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Flash prevention: Apply theme class before React mounts.
      // Default is dark — add .dark unless user chose light.
      (function() {
        var theme = localStorage.getItem('overdeck.ui.theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script>
      // Flash prevention (PAN-3410): apply the Overdeck Theme design language
      // (Ledger/Broadsheet — independent from the dark/light color scheme
      // above) before React mounts. Default is broadsheet.
      (function() {
        var designLanguage = localStorage.getItem('overdeck.ui.designLanguage');
        document.documentElement.dataset.theme = designLanguage === 'ledger' ? 'ledger' : 'broadsheet';
      })();
    </script>
    <style>
      /* Pre-mount paint: keep the document dark/light per theme so a reload
         during a server restart never flashes a blank page (PAN-1580). The
         #pan-boot shell lives inside #root and is replaced the instant React
         mounts, so the restart window shows a "Connecting…" state, not blank. */
      html { background: #ffffff; }
      html.dark { background: #080b10; }
      body { margin: 0; }
      #pan-boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        /* Deliberate theme-invariant exception (PAN-3410 NFR-3): this inline
           <style> paints before index.css's --font-sans token loads (that CSS
           is imported by the main.tsx module script at the bottom of <body>,
           which hasn't executed yet at first paint) and before localStorage's
           theme mirror can be read here without duplicating that read. The
           var() fallback keeps today's literal if the token isn't resolved
           yet; either way #pan-boot is replaced by #root the instant React
           mounts (see the PAN-1580 note above), so it never needs to reflect
           the Ledger/Broadsheet distinction. */
        font-family: var(--font-sans, 'DM Sans', system-ui, sans-serif); font-size: 14px;
        color: #6b7280; background: inherit;
      }
      html.dark #pan-boot { color: #8b93a1; }
      #pan-boot .pan-spinner {
        width: 16px; height: 16px;
        border: 2px solid currentColor; border-top-color: transparent;
        border-radius: 50%; animation: pan-spin 0.8s linear infinite;
      }
      @keyframes pan-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="pan-boot"><span class="pan-spinner"></span>Connecting to the dashboard…</div>
    </div>
    <script>
      /* Boot watchdog (PAN-1580): the app's own restart recovery lives inside
         the JS bundle — useless while that bundle is the thing failing to load
         during a server restart. This bundle-independent watchdog waits for the
         server to come back and reloads once, so a restart self-recovers instead
         of sitting on "Connecting…" until a manual refresh. It stands down the
         instant main.tsx sets window.__panMounted. */
      (function () {
        var acting = false;
        var failingResource = '';
        var lastReloadKey = 'pan.recovery.lastReload';
        var reloadCountKey = 'pan.recovery.reloadCount';
        var reloadWindowMs = 15000;
        var maxConsecutiveReloads = 3;
        function setMsg(text) {
          var boot = document.getElementById('pan-boot');
          if (boot && boot.lastChild && boot.lastChild.nodeType === 3) boot.lastChild.textContent = text;
        }
        function sameOriginResource(t) {
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return null;
          var rawUrl = t.tagName === 'SCRIPT' ? t.src : t.href;
          if (!rawUrl) return null;
          try {
            var url = new URL(rawUrl, window.location.href);
            return url.origin === window.location.origin ? url.href : null;
          } catch (_) {
            return null;
          }
        }
        function showManualRecovery() {
          var boot = document.getElementById('pan-boot');
          if (!boot) return;
          boot.textContent = '';
          var message = document.createElement('span');
          message.textContent = 'The dashboard stopped automatic recovery after repeated load failures.' +
            (failingResource ? ' Failing resource: ' + failingResource : '');
          var button = document.createElement('button');
          button.type = 'button';
          button.textContent = 'Reload dashboard';
          button.onclick = function () { window.location.reload(); };
          boot.appendChild(message);
          boot.appendChild(button);
        }
        function reloadOrStop() {
          var now = Date.now();
          var lastReload = Number(sessionStorage.getItem(lastReloadKey) || '0');
          var previousCount = Number(sessionStorage.getItem(reloadCountKey) || '0');
          var count = now - lastReload < reloadWindowMs ? previousCount + 1 : 1;
          sessionStorage.setItem(lastReloadKey, String(now));
          sessionStorage.setItem(reloadCountKey, String(count));
          if (count > maxConsecutiveReloads) {
            showManualRecovery();
            return;
          }
          window.location.reload();
        }
        // Poll until BOTH a fresh index.html AND the bundle it references are
        // actually serveable, then reload exactly once. Verifying the bundle
        // before reloading means a normal restart waits for the fresh bundle.
        // Repeated failures in one tab stop at a manual-reload state instead of
        // looping forever on a resource that cannot heal.
        function whenServeableThenReload(n) {
          if (window.__panMounted) return;
          fetch('/', { cache: 'no-store' })
            .then(function (r) {
              if (!r.ok) throw 0;
              return r.text();
            })
            .then(function (html) {
              // Pick the real entry module — in dev the first module script is
              // /@vite/client (and @react-refresh), not the app entry, so skip those.
              var all = html.match(/<script[^>]+type="module"[^>]+src="([^"]+)"/g) || [];
              var src = null;
              for (var i = 0; i < all.length; i++) {
                var sm = all[i].match(/src="([^"]+)"/);
                if (sm && sm[1].indexOf('/@vite/') === -1 && sm[1].indexOf('@react-refresh') === -1) { src = sm[1]; break; }
              }
              if (!src) { reloadOrStop(); return; } // can't locate bundle; just reload
              return fetch(src, { method: 'HEAD', cache: 'no-store' }).then(function (b) {
                if (b.ok) reloadOrStop(); else throw 0;
              });
            })
            .catch(function () {
              setTimeout(function () { whenServeableThenReload(n + 1); }, Math.min(500 + n * 250, 3000));
            });
        }
        function recover(resource) {
          if (acting || window.__panMounted) return;
          acting = true;
          failingResource = resource || '';
          setMsg('Reconnecting to the dashboard…');
          whenServeableThenReload(0);
        }
        // Recover ONLY on a precise signal: the entry module/stylesheet failing
        // to LOAD (the real "assets 404 during a server restart" event), which
        // surfaces as a capture-phase window error on the element. No blanket
        // timeout — a slow-but-fine mount must never trigger a reload.
        window.addEventListener('error', function (e) {
          var resource = sameOriginResource(e && e.target);
          if (resource) recover(resource);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
