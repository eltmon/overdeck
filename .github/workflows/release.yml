name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      npm_tag: ${{ steps.channel.outputs.npm_tag }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Classify release channel
        id: channel
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9]+$ ]]; then
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "npm_tag=canary" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported release tag: $tag"
            exit 1
          fi

      - name: Verify tag matches pan release stable output
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="${tag#v}"
          root_v=$(node -p "require('./package.json').version")
          desktop_v=$(node -p "require('./apps/desktop/package.json').version")
          contracts_v=$(node -p "require('./packages/contracts/package.json').version")
          notes_path=".release/${tag}.md"

          fail=0
          if [ "$root_v" != "$expected" ]; then
            echo "::error::package.json version is $root_v, expected $expected. Did you run 'pan release stable --version $expected'?"
            fail=1
          fi
          if [ "$desktop_v" != "$expected" ]; then
            echo "::error::apps/desktop/package.json version is $desktop_v, expected $expected."
            fail=1
          fi
          if [ "$contracts_v" != "$expected" ]; then
            echo "::error::packages/contracts/package.json version is $contracts_v, expected $expected."
            fail=1
          fi
          if [ ! -f "$notes_path" ]; then
            echo "::error::Release notes $notes_path missing. Only 'pan release stable' produces this file."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Release guard failed. Tags must be produced by 'pan release stable' so version bumps and release notes are committed atomically."
            exit 1
          fi
          echo "Release guard passed: $tag matches all three package.json files and $notes_path is committed."

  # PAN-5176: build, test and pack @overdeck/core once. The tarball this job
  # uploads is exactly what bare-host-macos smokes and what npm publishes.
  pack:
    # PAN-5463: the tarball ships the macOS computer-use helper zip that the
    # computer-use-macos job builds, so pack waits for it.
    needs: [classify, computer-use-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Deliberately NO `registry-url`. setup-node's registry-url writes a
          # dummy `//registry.npmjs.org/:_authToken=XXXXX...` into .npmrc, which
          # makes `npm publish` attempt (failing) token auth instead of OIDC
          # Trusted Publishing — the cause of the v0.30.0/v0.30.1 publish 404s.
          # With npm 11.5.1+ and `id-token: write`, `npm publish` uses OIDC
          # automatically when no token is configured (requires a Trusted
          # Publisher on each @overdeck/* package on npmjs.com).

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        run: |
          RG_VERSION=15.1.0
          curl -fsSL -o /tmp/ripgrep.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/ripgrep.tar.gz -C /tmp
          sudo install "/tmp/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg

          rg --version

      - name: Build
        run: bun run build

      - name: Upload dashboard sourcemaps to PostHog
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_HOST: https://us.posthog.com
          OVERDECK_TELEMETRY: '0'
        run: node dist/cli/index.js release sourcemaps --version "${GITHUB_REF_NAME#v}"

      # PAN-1609: gate the release on the full test suite. release.yml is a
      # separate workflow from ci.yml (it fires on tag push, not PR), so without
      # this a `v*` tag could publish a red vitest suite to npm. A test failure
      # fails this job, and `npm` needs it, so nothing is published (and the
      # GitHub Release job, which `needs: npm`, is blocked). chromium is
      # required by the Playwright-backed UAT tests in the suite; SKIP_DOCS_INDEX
      # matches ci.yml (the docs index is a publish-time artifact, irrelevant to
      # verifying code).
      - name: Install Playwright browsers (chromium) for vitest UAT
        run: npx playwright install --with-deps chromium

      - name: Test (full suite — gate the release)
        env:
          SKIP_DOCS_INDEX: '1'
        run: npm test

      - name: Test CLI
        run: |
          node dist/cli/index.js --version
          node dist/cli/index.js --help

      # PAN-5463: put the macOS helper zip where package.json `files` ("native")
      # picks it up, so `npx @overdeck/core` on macOS can install it.
      - name: Download the macOS computer-use helper
        uses: actions/download-artifact@v4
        with:
          name: computer-use-macos-helper
          path: native/computer-use-macos/dist

      - name: Check the macOS computer-use helper is present
        run: |
          for f in overdeck-computer-use-macos.zip overdeck-computer-use-macos.zip.sha256; do
            if [ ! -s "native/computer-use-macos/dist/$f" ]; then
              echo "::error::native/computer-use-macos/dist/$f is missing; the computer-use-macos job must build it."
              exit 1
            fi
          done

      # PAN-5176: pack AFTER the sourcemaps step (it injects chunk ids into dist and
      # removes .map files) and after the test gate; this tarball is what npm gets.
      - name: Pack @overdeck/core
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"

      # PAN-5463: a nested .gitignore or a `files` change could silently drop the
      # helper from the tarball; fail the release instead.
      - name: Check the tarball contains the macOS computer-use helper
        run: |
          tarball="$(ls "$RUNNER_TEMP"/release/*.tgz)"
          entries="$(tar -tzf "$tarball")"
          for f in overdeck-computer-use-macos.zip overdeck-computer-use-macos.zip.sha256; do
            if ! grep -qx "package/native/computer-use-macos/dist/$f" <<<"$entries"; then
              echo "::error::$tarball lacks package/native/computer-use-macos/dist/$f"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-core-tarball
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error

  # PAN-5463: build the macOS computer-use helper (`Overdeck Computer Use.app`,
  # zipped) that pack ships in the npm tarball. Ad-hoc signed unless the
  # Developer ID certificate secret exists; notarized only when the App Store
  # Connect API key secrets exist (see scripts/build-computer-macos.mjs).
  computer-use-macos:
    needs: classify
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The `secrets` context is not allowed in step-level `if:` expressions,
      # so surface presence flags here (same pattern as the desktop job).
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import the Developer ID certificate (certificate configured)
        if: env.HAS_MAC_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          cert_path="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/computer-use-signing.keychain-db"
          keychain_pwd="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_pwd" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pwd" "$keychain"
          security import "$cert_path" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pwd" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert_path"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          echo "OVERDECK_COMPUTER_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare Apple API key (API key configured)
        if: env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build the helper app
        run: npm run build:computer-macos

      - uses: actions/upload-artifact@v4
        with:
          name: computer-use-macos-helper
          path: |
            native/computer-use-macos/dist/overdeck-computer-use-macos.zip
            native/computer-use-macos/dist/overdeck-computer-use-macos.zip.sha256
          if-no-files-found: error

  # PAN-5176: the release gate. Install the exact tarball npm will get on a
  # bare macOS host (no docker, tmux, systemctl, journalctl or brew on PATH)
  # and fail on the PAN-5168/5169/5170 bug classes. `npm` needs this job, so
  # a failed smoke publishes nothing and creates no GitHub Release.
  bare-host-macos:
    needs: pack
    runs-on: macos-latest
    timeout-minutes: 30
    # It runs a downloaded installer and needs no write or publish token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the release tarball
        uses: actions/download-artifact@v4
        with:
          name: release-core-tarball
          path: ${{ runner.temp }}/release

      # PAN-5176: the smoke counts new PIDs, and Spotlight's mdworker processes
      # indexing the fresh npm install swamp that count on a hosted runner
      # (baselines of 600 to 1100 per 30 s with nothing of ours running).
      # Indexing is turned off on this throwaway runner only; the smoke itself
      # never changes a developer's Mac.
      - name: Turn off Spotlight indexing on the runner
        run: |
          sudo mdutil -a -i off || echo "::warning::mdutil could not turn off indexing"
          mdutil -a -s || true

      - name: Bare-host smoke (macOS /bin/bash 3.2)
        run: /bin/bash scripts/bare-host-smoke.sh --tarball "$(ls "$RUNNER_TEMP"/release/*.tgz)" --work-dir "$RUNNER_TEMP/bare-host"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bare-host-macos-release-logs
          path: |
            ${{ runner.temp }}/bare-host/result.json
            ${{ runner.temp }}/bare-host/*.log
          if-no-files-found: warn

  npm:
    needs: [classify, pack, bare-host-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Deliberately NO `registry-url`. setup-node's registry-url writes a
          # dummy `//registry.npmjs.org/:_authToken=XXXXX...` into .npmrc, which
          # makes `npm publish` attempt (failing) token auth instead of OIDC
          # Trusted Publishing — the cause of the v0.30.0/v0.30.1 publish 404s.
          # With npm 11.5.1+ and `id-token: write`, `npm publish` uses OIDC
          # automatically when no token is configured (requires a Trusted
          # Publisher on each @overdeck/* package on npmjs.com).

      # npm >= 11.5.1 is required for OIDC trusted publishing. Node 22 LTS
      # ships npm 10.x. We can't `npm install -g npm@latest` in place — the
      # in-place upgrade corrupts npm's own dependency tree partway through
      # ("Cannot find module 'promise-retry'"). Install to a separate prefix
      # and prepend to PATH instead.
      - name: Install npm 11 for OIDC trusted publishing
        run: |
          npm install --location=global --prefix="$RUNNER_TEMP/npm-bin" npm@11
          echo "$RUNNER_TEMP/npm-bin/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-bin/bin/npm" --version

      - name: Download the release tarball
        uses: actions/download-artifact@v4
        with:
          name: release-core-tarball
          path: ${{ runner.temp }}/release

      # PAN-5176: every build step runs before the first publish, so a failed
      # build stops the job before anything reaches npm.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Build contracts
        run: cd packages/contracts && npm run build

      # PAN-5424: build and size-check the desktop package before ANY publish,
      # so an oversized or broken desktop package stops the job before
      # @overdeck/core and @overdeck/contracts reach npm (no half-release).
      - name: Build desktop package
        run: cd apps/desktop && node scripts/build-for-publish.mjs

      # Trusted Publishing: no NODE_AUTH_TOKEN. npm authenticates to npmjs.org
      # using the GitHub OIDC token granted by `id-token: write` above. The
      # trusted-publisher config on each @overdeck/* package on npmjs.com pins
      # this repo + workflow filename as the only allowed publisher.
      # PAN-5176: publish the tarball the pack job built, tested and smoked, not a
      # fresh pack of this checkout.
      # PAN-5595: scripts/npm-publish-retry-safe.sh handles the retry-safe
      # visibility check, staged-version (E409) detection, and the post-publish
      # visibility poll — see docs/RELEASING.md for the staged-version recovery.
      - name: Publish CLI to npm
        env:
          NPM_TAG: ${{ needs.classify.outputs.npm_tag }}
        run: |
          TGZ=$(ls "$RUNNER_TEMP"/release/*.tgz)
          bash scripts/npm-publish-retry-safe.sh --tag "$NPM_TAG" "$TGZ"

      - name: Publish contracts to npm
        env:
          NPM_TAG: ${{ needs.classify.outputs.npm_tag }}
        run: bash scripts/npm-publish-retry-safe.sh --tag "$NPM_TAG" packages/contracts

      - name: Publish desktop to npm
        env:
          NPM_TAG: ${{ needs.classify.outputs.npm_tag }}
        run: bash scripts/npm-publish-retry-safe.sh --tag "$NPM_TAG" apps/desktop

      # The deprecate step is dropped intentionally: it required a long-lived
      # NPM_TOKEN and OIDC trusted publishing only covers publish, not metadata
      # writes. overdeck and @eltmon/panctl are already deprecated on
      # npm (from prior releases) — deprecation is idempotent metadata, not
      # something to re-assert every release.

  desktop:
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            script: build:desktop:linux
            artifact: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.yml
              apps/desktop/dist/*.blockmap
          - os: macos-latest
            target: mac
            script: build:desktop:mac
            artifact: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
              apps/desktop/dist/*.yml
              apps/desktop/dist/*.blockmap
          - os: windows-latest
            target: win
            script: build:desktop:win
            artifact: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.yml
              apps/desktop/dist/*.blockmap
    runs-on: ${{ matrix.os }}
    env:
      # The `secrets` context is not allowed in step-level `if:` expressions
      # (the workflow fails validation with zero jobs), so surface presence
      # flags here and let the signing steps test these instead.
      HAS_MAC_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # macOS only: decode the App Store Connect API key (.p8) from a base64
      # secret to a file on the runner. @electron/notarize (invoked by the
      # afterSign hook in apps/desktop/scripts/notarize.cjs) needs a file path,
      # not the key material inline. Skipped when the secret isn't configured —
      # the notarize hook no-ops without APPLE_API_KEY.
      - name: Prepare Apple API key (macOS)
        if: matrix.target == 'mac' && env.HAS_APPLE_API_KEY == 'true'
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      # macOS only: export code-signing env ONLY when the certificate secret is
      # configured. An empty CSC_LINK is NOT ignored by electron-builder — it is
      # treated as a certificate file path, resolves to the cwd, and fails the
      # build with "not a file" (broke the v0.45.8 mac build). With these vars
      # absent, electron-builder falls back to keychain auto-discovery, finds no
      # identity on the runner, and ships the app unsigned — the pre-signing
      # behavior.
      - name: Enable macOS code signing (macOS, certificate configured)
        if: matrix.target == 'mac' && env.HAS_MAC_CERT == 'true'
        shell: bash
        run: |
          {
            echo "CSC_LINK=${{ secrets.MACOS_CERTIFICATE }}"
            echo "CSC_KEY_PASSWORD=${{ secrets.MACOS_CERTIFICATE_PWD }}"
          } >> "$GITHUB_ENV"

      - name: Build desktop app (${{ matrix.target }})
        run: bun run ${{ matrix.script }}
        env:
          # Code signing (CSC_LINK / CSC_KEY_PASSWORD) is exported by the
          # "Enable macOS code signing" step above only when the certificate
          # secret exists. Notarization (App Store Connect API key): APPLE_API_KEY
          # (the .p8 file path) is exported by the "Prepare Apple API key" step;
          # the notarize hook no-ops when any of these are empty.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  release:
    needs: [classify, npm, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Resolve release notes
        run: |
          notes=".release/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes $notes are missing. 'pan release stable' must commit them before tag push."
            exit 1
          fi
          echo "Using committed release notes: $notes"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: .release/${{ github.ref_name }}.md
          prerelease: ${{ needs.classify.outputs.prerelease }}
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
