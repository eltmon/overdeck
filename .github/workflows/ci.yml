name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PAN-1659: skip the heavy docs-index build in CI. The docs-RAG index is a
# repo-wide, publish-time artifact (built by prepublishOnly / build-for-publish.mjs
# on release) — it has nothing to do with verifying an individual issue's code,
# and rebuilding it in every CI job (build/test/smoke) pegged CPU and 429'd on
# HuggingFace. CI never publishes, so it never needs the index.
env:
  SKIP_DOCS_INDEX: '1'

# NOTE: This workflow is a safety check ONLY. The primary verification gate runs in
# Overdeck's verification-runner BEFORE PR creation. GitHub CI runs here for cross-developer
# verification and as a secondary check. IMPORTANT: If tests fail here, they MUST feed back
# through Overdeck's verification system (via webhook or API callback) to message the work
# agent. Without this feedback loop, failed PRs get stuck with no way for the agent to know
# and fix them. See PAN-805 for the design of this feedback bridge.

jobs:
  build:
    runs-on: ubuntu-latest
    # PAN-1651: every job MUST cap its wall-clock. Without this a hung step
    # (an orphaned dashboard server, a never-resolving health poll) runs until
    # GitHub's 6h default, the required check never reports, and PRs can't
    # merge. Fail fast so a re-run can recover.
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify lockfile integrity
        run: |
          if ! git diff --quiet bun.lock; then
            echo "bun.lock was modified by install. Lockfile is out of sync with package.json."
            exit 1
          fi

      - name: Verify Effect API surface
        run: node scripts/verify-effect-api.mjs

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test CLI
        run: |
          node dist/cli/index.js --version
          node dist/cli/index.js --help

  # `npm run lint` took ~9 min as one job, almost all of it in three steps.
  # scripts/run-lint-group.mjs splits the lint script's steps into groups that
  # run as parallel jobs; any step it doesn't name as heavy runs in `core`.
  lint-group:
    name: lint-group (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20  # PAN-1651: cap wall-clock so a hung step can't wedge the required check.
    strategy:
      fail-fast: false
      matrix:
        group: [core, effect, skills, state]

    steps:
      - uses: actions/checkout@v4
        with:
          # PAN-2227: lint:ratchet-audit (core) diffs the last baseline/allowlist
          # commit against its parent. The other groups read no history.
          fetch-depth: ${{ matrix.group == 'core' && '0' || '1' }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        run: |
          RG_VERSION=15.1.0
          curl -fsSL -o /tmp/ripgrep.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/ripgrep.tar.gz -C /tmp
          sudo install "/tmp/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version

      # lint:no-state-layer is a source grep and needs no build.
      - name: Build
        if: matrix.group != 'state'
        run: npm run build

      - name: Lint (${{ matrix.group }})
        run: node scripts/run-lint-group.mjs ${{ matrix.group }}

  # `lint` is a check name the close-out gate requires on main
  # (DEFAULT_MAIN_VERIFY_REQUIRED_CHECKS in src/lib/lifecycle/dod-gate.ts), so
  # it stays one job: green only when every lint group passed.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-group]
    if: always()
    steps:
      - name: All lint groups passed
        run: |
          echo "lint-group: ${{ needs.lint-group.result }}"
          test "${{ needs.lint-group.result }}" = success

  prompt-gate:
    runs-on: ubuntu-latest
    name: Prompt change trailer gate
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Prompt-Change trailer for roles/ and docs/flywheel-brief.md
        run: bash scripts/check-prompt-change-trailer.sh

  # The root vitest suite (~1,300 files) is split across four parallel jobs.
  # Each shard runs four workers on the runner's four cores. Most of the
  # suite's time is per-file module import, which splits evenly.
  test-shard:
    name: test-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # PAN-1651: every job caps its wall-clock so a hang fails fast.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        run: |
          RG_VERSION=15.1.0
          curl -fsSL -o /tmp/ripgrep.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/ripgrep.tar.gz -C /tmp
          sudo install "/tmp/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg

          rg --version

      - name: Build
        run: npm run build

      - name: Install Playwright browsers (root) for vitest e2e
        run: npx playwright install --with-deps chromium

      # PAN-3847 (FR-13): CI runs vitest on every push. The overdeck/test commit
      # status only records that the verification gate passed; it is never read here.
      - name: Test (shard ${{ matrix.shard }}/4)
        run: npx vitest run --configLoader runner --shard=${{ matrix.shard }}/4

  # Everything `test` ran after the root suite, in parallel with the shards:
  # the frontend subset from `npm test`, the benchmark, and the Command Deck
  # Playwright spec against a live dashboard server.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ripgrep
        run: |
          RG_VERSION=15.1.0
          curl -fsSL -o /tmp/ripgrep.tar.gz "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/ripgrep.tar.gz -C /tmp
          sudo install "/tmp/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg

          rg --version

      - name: Build
        run: npm run build

      - name: Frontend test subset
        run: npm run test:frontend-subset

      - name: Resource discovery benchmark
        run: VITEST_INCLUDE_BENCH=1 npx vitest run src/dashboard/server/services/resource-discovery.bench.ts

      - name: Install Playwright browsers
        run: cd src/dashboard/frontend && npx playwright install --with-deps chromium

      - name: Start dashboard server
        run: |
          # Detach stdin so the backgrounded server doesn't hold this step's pipe
          # open (which would keep the step "running" indefinitely). The server
          # must stay up for the Playwright step that follows, so it is not killed
          # here — the job tears it down on completion.
          DASHBOARD_URL=http://localhost:3011 nohup node dist/dashboard/server.js > /tmp/pan-dashboard.log 2>&1 < /dev/null &
          for i in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 3 -sf http://localhost:3011/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pan-dashboard.log
          exit 1

      - name: Run Command Deck Playwright spec
        env:
          DASHBOARD_URL: http://localhost:3011
        run: cd src/dashboard/frontend && npm run test:playwright

  # `test` is the check name the close-out gate requires on main
  # (DEFAULT_MAIN_VERIFY_REQUIRED_CHECKS in src/lib/lifecycle/dod-gate.ts), so
  # it stays one job: green only when every shard and test-e2e passed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-shard, test-e2e]
    if: always()
    steps:
      - name: All test jobs passed
        run: |
          echo "test-shard: ${{ needs.test-shard.result }}"
          echo "test-e2e:   ${{ needs.test-e2e.result }}"
          test "${{ needs.test-shard.result }}" = success
          test "${{ needs.test-e2e.result }}" = success

  flake-lane:
    runs-on: ubuntu-latest
    name: Non-blocking flake lane
    # PAN-2373: run quarantined flaky tests separately so they cannot block the
    # merge gate, while still observing whether they pass with retry enabled.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: npm run build

      - name: Install Playwright browsers for quarantined tests
        run: npx playwright install --with-deps chromium

      - name: Run quarantined tests (non-blocking)
        # Non-blocking: failures are logged but do not fail the job or block the PR.
        # Each quarantined file is run individually so the job summary can record
        # per-file pass/fail as an always-current ledger.
        continue-on-error: true
        run: bash scripts/run-flake-lane.sh

  clean-install:
    runs-on: ubuntu-latest
    name: Clean install + server smoke test
    timeout-minutes: 20  # PAN-1651: the smoke-test server poll must not be able to hang the required check.

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Purge caches and install fresh
        run: |
          rm -rf node_modules
          rm -rf src/dashboard/server/node_modules
          rm -rf packages/contracts/node_modules
          bun install --frozen-lockfile

      - name: Verify Effect API surface
        run: node scripts/verify-effect-api.mjs

      - name: Build
        run: npm run build

      - name: Smoke test dashboard server
        run: |
          # Detach stdin (< /dev/null) so the backgrounded server doesn't hold
          # this step's pipe open, and capture its PID so we can stop it after
          # the health check. Without the kill the orphaned server keeps the
          # GitHub Actions step "running" indefinitely (observed: 2h+), so the
          # required check never reports a result and PRs can't merge.
          DASHBOARD_URL=http://localhost:3011 nohup node dist/dashboard/server.js > /tmp/pan-dashboard.log 2>&1 < /dev/null &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl --connect-timeout 1 --max-time 2 -sf http://localhost:3011/api/health > /dev/null; then
              echo "Dashboard server started successfully"
              ok=1
              break
            fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          if [ "$ok" != 1 ]; then cat /tmp/pan-dashboard.log; exit 1; fi
