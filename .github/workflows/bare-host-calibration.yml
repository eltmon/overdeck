name: PAN-5361 bare-host calibration (temporary)

# PAN-5361: gathers the live evidence WI-5 needs to set IDLE_BUDGET_LINUX by
# the D14 rule before pan done opens the PR (ci.yml only runs on PRs and on
# main, and its concurrency group cancels a superseded run). Deleted once the
# calibration evidence is recorded in .pan/drafts/pan-5361.md.
#
# bare-host-smoke.sh's WINDOWS_PER_SIDE_LINUX is temporarily 10 (a superset):
# the review cycles (fa257f60, 8f9a2499) found the dashboard runs post-boot
# probe bursts and a permanent 60 s periodic docker/git check, so every other
# 30 s window is structurally elevated and the previous min-of-3 was
# effectively min-of-2. This run captures 10 windows per side so the final
# window count can be chosen offline (the smallest N whose burst-injection
# replay shows zero flips), then re-run once at that final N for the
# permanent CI jobs' sake before this workflow is deleted.
#
# 20 plain Linux runs, 2 Linux runs with a 2000 ms idle spawner, 2 with a
# 500 ms idle spawner, one plain macOS run, and one known-bad macOS run
# (@overdeck/core@0.81.0, the last release with the PAN-5168/5169/5170 bugs).
# Every leg installs the published @overdeck/core from npm, so it needs no
# build job.
on:
  push:
    branches: [feature/pan-5361]

jobs:
  calibrate:
    name: calibrate (${{ matrix.rep }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rep: linux-01, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-02, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-03, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-04, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-05, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-06, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-07, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-08, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-09, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-10, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-11, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-12, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-13, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-14, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-15, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-16, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-17, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-18, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-19, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-20, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-2000-a, os: ubuntu-latest, version: '0.86.0', spawnerMs: '2000' }
          - { rep: linux-2000-b, os: ubuntu-latest, version: '0.86.0', spawnerMs: '2000' }
          - { rep: linux-500-a, os: ubuntu-latest, version: '0.86.0', spawnerMs: '500' }
          - { rep: linux-500-b, os: ubuntu-latest, version: '0.86.0', spawnerMs: '500' }
          - { rep: macos-plain, os: macos-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: macos-known-bad, os: macos-latest, version: '0.81.0', spawnerMs: '' }
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Turn off Spotlight indexing on the runner (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || echo "::warning::mdutil could not turn off indexing"
          mdutil -a -s || true

      # Each run uses set +e so a failing idle check (expected for the
      # spawner and known-bad legs) doesn't fail the step; the rc and
      # result.json carry the outcome instead.
      - id: smoke
        name: Bare-host smoke
        run: |
          set +e
          args=(--version "${{ matrix.version }}" --work-dir "$RUNNER_TEMP/calib")
          if [ -n "${{ matrix.spawnerMs }}" ]; then
            args+=(--idle-spawner-ms "${{ matrix.spawnerMs }}")
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            /bin/bash scripts/bare-host-smoke.sh "${args[@]}"
          else
            bash scripts/bare-host-smoke.sh "${args[@]}"
          fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Print the result
        if: always()
        run: cat "$RUNNER_TEMP/calib/result.json" || echo "no result.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bare-host-calibration-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/calib/result.json
            ${{ runner.temp }}/calib/*.log
          if-no-files-found: warn
