name: PAN-5361 bare-host calibration (temporary)

# PAN-5361 exploratory mapping run (review cycles fa257f60, 8f9a2499): finds
# the full timeline of the directly started dashboard's post-boot probe
# activity, using WINDOWS_PER_SIDE_LINUX=10 (set in bare-host-smoke.sh, WIP)
# to cover about 21-321 s after boot in one run. 10 plain Linux legs only --
# no macOS, no spawner legs -- since this pass is about mapping the
# timeline, not the full WI-5 evidence set. Deleted once the final 26-leg
# evidence run replaces it.
on:
  push:
    branches: [feature/pan-5361]

jobs:
  calibrate:
    name: calibrate (${{ matrix.rep }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rep: linux-01, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-02, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-03, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-04, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-05, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-06, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-07, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-08, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-09, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
          - { rep: linux-10, os: ubuntu-latest, version: '0.86.0', spawnerMs: '' }
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Turn off Spotlight indexing on the runner (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || echo "::warning::mdutil could not turn off indexing"
          mdutil -a -s || true

      # Each run uses set +e so a failing idle check (expected for the
      # spawner and known-bad legs) doesn't fail the step; the rc and
      # result.json carry the outcome instead.
      - id: smoke
        name: Bare-host smoke
        run: |
          set +e
          args=(--version "${{ matrix.version }}" --work-dir "$RUNNER_TEMP/calib")
          if [ -n "${{ matrix.spawnerMs }}" ]; then
            args+=(--idle-spawner-ms "${{ matrix.spawnerMs }}")
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            /bin/bash scripts/bare-host-smoke.sh "${args[@]}"
          else
            bash scripts/bare-host-smoke.sh "${args[@]}"
          fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Print the result
        if: always()
        run: cat "$RUNNER_TEMP/calib/result.json" || echo "no result.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bare-host-calibration-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/calib/result.json
            ${{ runner.temp }}/calib/*.log
          if-no-files-found: warn
