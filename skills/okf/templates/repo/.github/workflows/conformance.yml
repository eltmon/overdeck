name: OKF conformance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m pip install PyYAML
      - run: python3 ../code-repo/skills/okf/scripts/validate.py --bundle . --strict
      - run: python3 ../code-repo/skills/okf/scripts/diff_lint.py --base . --head .
