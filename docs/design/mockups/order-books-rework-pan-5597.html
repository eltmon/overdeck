  } }

  .pop p { margin: 0 0 8px; }

  .pop .f { display: flex; gap: 8px; justify-content: flex-end; }
  .menu { position: fixed; z-index: 20; background: var(--popover); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-floating); padding: 4px; min-width: 190px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 10px; border-radius: 4px; font-size: 12.5px; }
  .menu button:hover { background: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--foreground); color: var(--background); padding: 6px 14px; border-radius: var(--radius); font-size: 12.5px; z-index: 30; }
  .blank { max-width: 520px; margin: 60px auto; text-align: center; color: var(--muted-foreground); }

  }
</style>

<script>

  'PAN-4101':'Anywhere: pair a machine from the phone','PAN-4102':'Anywhere: relay fallback when ICE fails','PAN-4110':'Anywhere: show link health on the Machines page','PAN-4000':'Anywhere: secure channel handshake',
  'PAN-5470':'Docs: every feature page has a screenshot','PAN-5471':'Docs: CLI reference generated from --help','PAN-5472':'Docs: troubleshooting index',
  'PAN-2445':'Refactor P3: split agents routes','PAN-2233':'Refactor P3: one liveness module',

const BACKLOG = ['PAN-5013','PAN-5567','PAN-5489','PAN-5566','PAN-5385','PAN-4636','PAN-5523','PAN-4733'];
const it = (issue, lane, st, extra) => Object.assign({ issue, lane, st, prereqs: [], reVerify: false, planAtPickup: false, hasPrd: true }, extra || {});
function seed() { return {
  sel: 'wf', showLanded: {}, drawer: false, addLane: 'A', q: '', optsOpen: null, briefOpen: false, archivedOpen: false, renaming: false,
  books: [
    { id: 'wf', bookId: '2026-11-14-workflow-redesign-pan-5284', name: 'Workflow redesign', status: 'ready', conc: 2, paused: null, brief: '', items: [
      it('PAN-5281','A','landed'), it('PAN-5287','A','landed'), it('PAN-5288','A','landed',{prereqs:['PAN-5287']}), it('PAN-5292','A','landed'), it('PAN-5329','A','landed'),

    { id: 'aw', bookId: '2026-08-08-overdeck-anywhere', name: 'Overdeck Anywhere', status: 'draft', conc: 3, paused: null, brief: 'docs/briefs/anywhere.md', items: [

    { id: 'p3', bookId: '2026-07-28-refactor-p3-remainder', name: 'Refactor P3 remainder', status: 'draft', conc: 2, paused: { by: 'operator', at: 'Jul 28', why: 'Waiting for the agents-route split to land.' }, brief: '', items: [
      it('PAN-2445','A','queued'), it('PAN-2233','B','queued') ] },

  if (unmet.length) return 'Waiting for ' + unmet.join(', ');

document.addEventListener('dragover', (e) => { if (!drag) return; const lane = e.target.closest('.lane'); if (!lane) return; e.preventDefault();
  document.querySelectorAll('.dragover,.dropok').forEach((x) => x.classList.remove('dragover', 'dropok')); const r = e.target.closest('.row[data-issue]'); (r || lane).classList.add(r ? 'dragover' : 'dropok'); });
document.addEventListener('drop', (e) => { if (!drag) return; const laneEl = e.target.closest('.lane'); if (!laneEl) return; e.preventDefault();
  const b = book(), lane = laneEl.dataset.lane, before = e.target.closest('.row[data-issue]');
  let item;
  if (drag.cand) { addIssue(drag.cand, lane); item = b.items.find((i) => i.issue === drag.cand); } else item = b.items.find((i) => i.issue === drag.issue);
  if (item) { item.lane = lane; b.items.splice(b.items.indexOf(item), 1); const at = before && before.dataset.issue !== item.issue ? b.items.findIndex((i) => i.issue === before.dataset.issue) : -1; if (at >= 0) b.items.splice(at, 0, item); else b.items.push(item); }
  drag = null; render(); });
document.addEventListener('dragend', () => { drag = null; document.querySelectorAll('.dragover,.dropok').forEach((x) => x.classList.remove('dragover', 'dropok')); });

$('#fw').onchange = (e) => { flywheel = e.target.value === '1'; render(); };
$('#theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
$('#reset').onclick = () => { S = seed(); flywheel = true; $('#fw').value = '1'; render(); };
render();
</script>
</body>
