apply plugin: 'com.android.application'

// Release signing comes from the environment (apps/mobile/scripts/build-android.sh); debug and CI builds have none.
def uploadKeystorePath = System.getenv("OVERDECK_UPLOAD_KEYSTORE")
def uploadStorePassword = System.getenv("OVERDECK_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = System.getenv("OVERDECK_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = System.getenv("OVERDECK_UPLOAD_KEY_PASSWORD")

// PAN-5654: Robolectric runs offline. These two versions move together: the android-all
// version is the one robolectric's DefaultSdkProvider maps to SDK 35, the level the tests pin
// with @Config(sdk = 35). A mismatch fails the tests with "Unable to locate dependency".
def robolectricVersion = '4.15.1'
def robolectricAndroidAllVersion = '15-robolectric-12650502-i7'

android {
    namespace = "ai.overdeck.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.overdeck.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((project.findProperty("overdeckVersionCode") ?: "1") as Integer)
        versionName((project.findProperty("overdeckVersionName") ?: "1.0") as String)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadKeystorePath) {
                storeFile file(uploadKeystorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (uploadKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions { unitTests { includeAndroidResources = true } }
    sourceSets { test { resources.srcDirs += ["$rootDir/../../../tests/fixtures/phone-push"] } }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations {
    robolectricRuntime { transitive = false }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.goterl:lazysodium-android:5.1.0@aar'
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    robolectricRuntime "org.robolectric:android-all-instrumented:$robolectricAndroidAllVersion"
    testImplementation 'com.goterl:lazysodium-java:5.1.0'
    testImplementation 'net.java.dev.jna:jna:5.14.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// PAN-5654: Gradle fetches Robolectric's android-all jar (cached in ~/.gradle, and by
// setup-java's Gradle cache in CI), so a test run never downloads it through Robolectric's
// own MavenArtifactFetcher.
def robolectricDependencyDir = layout.buildDirectory.dir('robolectric-runtime').get().asFile
def fetchRobolectricRuntime = tasks.register('fetchRobolectricRuntime', Sync) {
    from configurations.robolectricRuntime
    into robolectricDependencyDir
}
tasks.withType(Test).configureEach {
    dependsOn fetchRobolectricRuntime
    systemProperty 'robolectric.offline', 'true'
    systemProperty 'robolectric.dependency.dir', robolectricDependencyDir.absolutePath
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
