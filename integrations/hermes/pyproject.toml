[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "overdeck-hermes"
version = "0.1.0"
description = "Overdeck: see and steer your coding agents from Hermes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Overdeck" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."hermes_agent.plugins"]
overdeck = "overdeck_hermes"

[project.urls]
Repository = "https://github.com/eltmon/overdeck"

[tool.hatch.build.targets.wheel]
packages = ["src/overdeck_hermes"]

[tool.hatch.build.targets.wheel.force-include]
"skills/overdeck/SKILL.md" = "overdeck_hermes/skills/overdeck/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
